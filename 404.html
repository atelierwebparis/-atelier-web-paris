<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Page introuvable | Atelier Web Paris</title>

  <meta name="description"
        content="Cette page est introuvable. Retrouvez Atelier Web Paris et nos services de création de sites internet professionnels.">

  <!-- Une page 404 ne doit pas être indexée -->
  <meta name="robots"
        content="noindex, follow">

  <!-- Polices Atelier Web Paris -->
  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
        rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #f4efe8;
      color: #0d1424;
      font-family: "DM Sans", sans-serif;
    }

    .page-404 {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header-404 {
      padding: 28px 8%;
      border-bottom: 1px solid rgba(13, 20, 36, 0.12);
    }

    .logo-404 {
      display: block;
      width: 190px;
      max-width: 55%;
      height: auto;
    }

    .content-404 {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 70px 8%;
    }

    .inner-404 {
      width: 100%;
      max-width: 850px;
    }

    .number-404 {
      margin-bottom: 20px;
      font-size: clamp(5rem, 18vw, 10rem);
      font-weight: 600;
      line-height: 0.85;
      letter-spacing: -0.06em;
    }

    .kicker-404 {
      margin-bottom: 25px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #687080;
    }

    h1 {
      max-width: 760px;
      margin-bottom: 25px;
      font-family: "Playfair Display", serif;
      font-size: clamp(2.6rem, 8vw, 5.5rem);
      font-weight: 500;
      line-height: 0.98;
      letter-spacing: -0.04em;
    }

    .text-404 {
      max-width: 590px;
      margin-bottom: 40px;
      color: #687080;
      font-size: 1.05rem;
      line-height: 1.8;
    }

    .button-404 {
      display: inline-block;
      padding: 16px 26px;
      background: #0d1424;
      color: #ffffff;
      border: 1px solid #0d1424;
      border-radius: 3px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      transition: 0.25s ease;
    }

    .button-404:hover {
      background: transparent;
      color: #0d1424;
    }

    @media (max-width: 600px) {

      .header-404 {
        padding: 24px 7%;
      }

      .logo-404 {
        width: 165px;
      }

      .content-404 {
        align-items: flex-start;
        padding: 70px 7% 60px;
      }

      .number-404 {
        margin-bottom: 25px;
      }

      .text-404 {
        font-size: 1rem;
      }

      .button-404 {
        width: 100%;
        text-align: center;
      }

    }

  </style>

</head>


<body>

  <div class="page-404">

    <header class="header-404">

      <a href="/-atelier-web-paris/"
         aria-label="Retour à l'accueil Atelier Web Paris">

        <img class="logo-404"
             src="/-atelier-web-paris/5EE2155D-583D-4C96-B18B-63D8548B5A4E.png"
             alt="Atelier Web Paris">

      </a>

    </header>


    <main class="content-404">

      <div class="inner-404">

        <div class="number-404">
          404
        </div>

        <p class="kicker-404">
          Page introuvable
        </p>

        <h1>
          Cette page s’est égarée dans Paris.
        </h1>

        <p class="text-404">
          La bonne nouvelle ? L’Atelier n’est jamais très loin.
          Revenez à l’accueil pour découvrir nos offres
          de création de sites internet.
        </p>

        <a class="button-404"
           href="/-atelier-web-paris/">
          Retour à l’accueil
        </a>

      </div>

    </main>

  </div>

</body>

</html>
